[project]
name = "m3os"
version = "0.1.0"
description = "Multi-agent molecular optimization with Monte Carlo graph search"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accfg>=0.0.8",
    "aiofiles>=25.1.0",
    "bs4>=0.0.2",
    "ddgs>=9.13.1",
    "faiss-cpu>=1.13.2",
    "fastapi>=0.104.0",
    "langchain>=1.1.0",
    "langchain-anthropic>=1.3.0",
    "langchain-chroma>=1.0.0",
    "langchain-classic>=1.0.0",
    "langchain-community>=0.4.1",
    "langchain-experimental>=0.4.1",
    "langchain-google-genai>=4.2.1",
    "langchain-mcp-adapters>=0.1.14",
    "langchain-openai>=1.1.0",
    "langchain-text-splitters>=1.0.0",
    "matplotlib>=3.10.7",
    "mcp==1.14.0",
    "networkx>=3.4.2",
    "pandas>=2.2.0",
    "rdkit>=2026.3.1",
    "scikit-learn>=1.7.2",
    "sse-starlette>=3.0.3",
    "tabulate>=0.10.0",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "uvicorn[standard]>=0.24.0",
    "deepagents==0.5.3",
    "typing-extensions>=4.15.0",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.2",
    "langchain-deepseek>=1.0.1",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
    "gemmi>=0.6.4",
    "numpy>=1.24",
    "openai>=2.24.0",
    "langchain-core>=1.2.0",
    "langgraph>=1.1.0",
    "json-repair>=0.58.7",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "tenacity>=9.0.0",
    "biopython>=1.84",
    "gradio-client>=2.5.0",
    "tqdm>=4.67.0",
    "python-docx>=1.2.0",
    "mineru-open-api>=0.5.9",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch" }]
torchvision = [{ index = "pytorch" }]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "pytest>=9.0.3",
]
